<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>PoolBet — prediction markets for friend groups</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PoolBet">
  <link rel="icon" href="/static/icons/icon-192.png">

  <!-- Type: Space Grotesk — elegant, geometric, dynamic, minimal -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="topbar">
    <div class="brand" onclick="Nav.home()"><span class="dot"></span> PoolBet</div>
    <div class="topbar-right">
      <button id="installBtn" class="btn ghost sm install-btn" title="Install app" aria-label="Install app" style="display:none" onclick="showInstall()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 12 5 5 5-5"/><path d="M5 21h14"/></svg>
      </button>
      <div class="who" id="who"></div>
    </div>
  </div>
  <div id="searchbar" class="searchbar"><div class="searchbar-inner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="searchInput" type="search" placeholder="Search markets & bettors…" autocomplete="off" oninput="onSearch(this.value)" />
    <button class="btn ghost sm" onclick="pbHideSearch()">Cancel</button>
  </div></div>
  <div class="wrap" id="app"></div>
  <div id="toasts"></div>
  <div id="modal-root"></div>
  <script src="/static/charts.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
